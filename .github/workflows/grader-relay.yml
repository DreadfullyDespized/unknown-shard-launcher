name: grader-relay

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: read

jobs:
  relay:
    if: >-
      startsWith(github.event.comment.body, 'Verdict: ') ||
      startsWith(github.event.review.body, 'Verdict: ') ||
      startsWith(github.event.comment.body, '/grader')
    concurrency:
      group: grader-relay-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Re-run the PR's latest gate run on a verdict or /grader, never waiting on the runner
        run: python3 tools/correction_loop/grader.py relay
        env:
          GH_TOKEN: ${{ github.token }}
