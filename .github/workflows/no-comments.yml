name: No comments

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-comments:
    name: No added comments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the checker
        run: python3 tools/check_no_comments.py --self-test
      - name: Fail on added comment lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_no_comments.py --base "origin/$BASE_REF" --head HEAD
