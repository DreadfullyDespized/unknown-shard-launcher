name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: dotnet build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build ShardLauncher.sln -c Release
      - name: Test
        run: dotnet test ShardLauncher.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: No build config or keys committed
        run: |
          if git ls-files --error-unmatch launcher.build.props >/dev/null 2>&1 || [ -n "$(git ls-files 'keys/*' '*.pem')" ]; then
            echo "launcher.build.props or key files are tracked; server config must stay out of this repo" >&2
            exit 1
          fi
