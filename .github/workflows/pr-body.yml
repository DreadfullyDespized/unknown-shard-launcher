name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  blast-radius:
    name: Blast radius section
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: python3 tools/check_pr_body.py --self-test
      - name: Require a non-empty Blast radius section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_pr_body.py
