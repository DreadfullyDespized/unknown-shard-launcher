name: grader

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to grade; run it on that PR's head branch"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  grader:
    name: grader
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail unless a grader PASS names this head and the PR is old enough
        run: python3 tools/correction_loop/grader.py check
        env:
          GH_TOKEN: ${{ github.token }}
