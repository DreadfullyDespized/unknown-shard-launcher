name: correction-loop tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: correction-loop tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the YAML parser for the workflow and issue-form checks
        run: python -m pip install pyyaml==6.0.2
      - name: Grader, intake, close gate and issue-form tests
        run: python -m unittest discover -s tools/correction_loop -p "test_*.py" -v
